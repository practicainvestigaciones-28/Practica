# nginx del frontend: sirve la aplicación (React) y reenvía /api y /socket.io al backend.
server {
  listen 80;
  server_name _;

  # Documentos y evidencias hasta 10 MB (con margen).
  client_max_body_size 20m;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Tiempo real (Socket.IO): requiere el cambio de protocolo a WebSocket.
  location /socket.io/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Archivos con hash en el nombre: se pueden guardar mucho tiempo en el navegador.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Rutas de React: cualquier otra va a index.html.
  location / {
    try_files $uri /index.html;
  }
}
